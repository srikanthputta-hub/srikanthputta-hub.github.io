name: Faceless YouTube
on:
  # PAUSED until the studio's QA gates are in (policy risk: AI-voiced money advice is non-monetizable).
  # To re-enable, restore:  schedule: [{cron: "17 14 * * 1,3,5"}]   (Mon/Wed/Fri)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, no upload"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: faceless-yt/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
      - run: pip install -r faceless-yt/requirements.txt
      - name: Run pipeline
        working-directory: faceless-yt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            faceless-yt/output/video.mp4
            faceless-yt/output/thumbnail.jpg
      - name: Save topic history
        run: |
          git config user.name "yt-bot" && git config user.email "yt-bot@users.noreply.github.com"
          for f in history.json ideas.json; do
            if [ -f "faceless-yt/$f" ]; then git add "faceless-yt/$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update YT history" && git pull --rebase origin main && git push
          fi
      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Faceless YouTube run failed"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "Run: $RUN_URL. If the log says the refresh token was rejected, re-run get_refresh_token.py and update the YT_REFRESH_TOKEN secret (tokens expire every 7 days while the Google app is in Testing)."
          fi
