name: Studio
on:
  # Schedules stay OFF until each channel has a clean dry run and the owner says go (see docs/ROADMAP.md).
  # Planned (UTC, adjust to the owner's time zone): finance "17 14 * * 1,3,5", news daily evening, ai-updates daily, facts "17 12 * * 2,4,6".
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel folder under channels/"
        type: choice
        options: [finance, facts, news, ai-updates]
        default: finance
      dry_run:
        description: "Render only, no upload"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: studio
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL: ${{ inputs.channel }}
      # The live Supabase board has no channel column yet, so only the finance channel writes to it.
      STUDIO_BOARD: ${{ inputs.channel == 'finance' && 'on' || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
      - run: pip install -r engine/requirements.txt
      - name: Run studio
        working-directory: engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ inputs.channel == 'finance' && (secrets.FINANCE_YT_CLIENT_ID || secrets.YT_CLIENT_ID) || inputs.channel == 'facts' && secrets.FACTS_YT_CLIENT_ID || inputs.channel == 'news' && secrets.NEWS_YT_CLIENT_ID || secrets.AI_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ inputs.channel == 'finance' && (secrets.FINANCE_YT_CLIENT_SECRET || secrets.YT_CLIENT_SECRET) || inputs.channel == 'facts' && secrets.FACTS_YT_CLIENT_SECRET || inputs.channel == 'news' && secrets.NEWS_YT_CLIENT_SECRET || secrets.AI_YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'finance' && (secrets.FINANCE_YT_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN) || inputs.channel == 'facts' && secrets.FACTS_YT_REFRESH_TOKEN || inputs.channel == 'news' && secrets.NEWS_YT_REFRESH_TOKEN || secrets.AI_YT_REFRESH_TOKEN }}
        run: python studio.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ inputs.channel }}
          retention-days: 7
          path: |
            channels/${{ inputs.channel }}/output/video.mp4
            channels/${{ inputs.channel }}/output/thumbnail.jpg
            channels/${{ inputs.channel }}/output/report.md
            channels/${{ inputs.channel }}/output/script.json
      - name: Save channel state, history and library
        if: always()
        run: |
          git config user.name "yt-bot" && git config user.email "yt-bot@users.noreply.github.com"
          for f in state.json history.json ideas.json library; do
            if [ -e "channels/$CHANNEL/$f" ]; then git add "channels/$CHANNEL/$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Studio update ($CHANNEL)" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Studio run failed ($CHANNEL)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "Run: $RUN_URL. If the log says the refresh token was rejected, re-run engine/get_refresh_token.py for this channel and update its YT refresh-token secret."
          fi
