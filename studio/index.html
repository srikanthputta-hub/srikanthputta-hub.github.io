<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Money Blueprint Studio</title>
<meta name="description" content="Live control room of the automated studio behind The Money Blueprint: who is working on what right now, and whether the last video passed every gate.">
<meta name="theme-color" content="#04101f">
<style>
:root{color-scheme:dark;--bg0:#030b18;--bg1:#06172d;--panel:#0a2140;--line:#1b4a80;--ink:#e9f1ff;--mute:#8da6c7;--blue:#2b86ff;--ok:#2cf28a;--warn:#ffb74d;--bad:#ff6b6b;--gold:#ffd166;--lime:#e3f58a;--meet:#7dd3fc}
*{box-sizing:border-box}
html{background:var(--bg0)}
body{margin:0;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background:radial-gradient(1100px 620px at 50% 22%,#0c2c58 0%,#071a33 52%,#030b18 100%) fixed}
.wrap{max-width:1220px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.brand{font-weight:800;letter-spacing:.14em;font-size:.78rem;color:var(--mute);text-transform:uppercase}

.conn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);background:rgba(10,33,64,.7)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.live{color:var(--ok);border-color:rgba(44,242,138,.45)}.conn.live i{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s infinite}
.conn.off{color:var(--warn)}
@keyframes blink{50%{opacity:.35}}
/* ---------- the stage ---------- */
.stage{position:relative;aspect-ratio:100/76;max-width:1180px;margin:0 auto}
.city{position:absolute;left:0;top:0;width:100%;height:48%;opacity:.55;pointer-events:none}

.lines path.base{fill:none;stroke:rgba(210,225,245,.28);stroke-width:1.6;stroke-dasharray:7 7}
.lines path.on{fill:none;stroke:var(--ok);stroke-width:2.2;stroke-dasharray:8 7;filter:drop-shadow(0 0 4px var(--ok));animation:flow 1.1s linear infinite;opacity:0}
.lines .doc{opacity:0}
.lines path.on.show{opacity:1}.lines .doc.show{opacity:1}
.lines path.meet{fill:none;stroke:var(--meet);stroke-width:2.2;stroke-dasharray:3 6;filter:drop-shadow(0 0 5px var(--meet))}

/* hub monitor */
.hub{position:absolute;left:30%;top:1.2%;width:40%;padding:14px 18px 12px;border:2px solid var(--blue);border-radius:16px;z-index:3;text-align:center;

.hub .bar i.off{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.hub .track{flex:1;height:5px;border-radius:5px;background:rgba(160,190,230,.18);overflow:hidden}
.hub .fill{height:100%;width:0;background:linear-gradient(90deg,#2b86ff,#2cf28a);border-radius:5px;transition:width .8s}
.hub h1{margin:2px 0 0;font-size:clamp(14px,2.6vw,31px);letter-spacing:.1em;white-space:nowrap;font-weight:800;text-shadow:0 0 18px rgba(80,160,255,.9),0 0 3px #fff}

.hub .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub .log em{font-style:normal;color:#f3e27a}

.platform{position:absolute;left:50%;top:54%;width:25%;transform:translate(-50%,-50%);z-index:2;text-align:center}
.disc{position:relative;height:0;padding-bottom:30%}
.disc i{position:absolute;left:0;right:0;bottom:0;height:56%;border-radius:50%;border:2px solid rgba(80,225,255,.55);box-shadow:0 0 22px rgba(80,225,255,.4),inset 0 0 22px rgba(80,225,255,.22);background:radial-gradient(ellipse at center,rgba(60,200,255,.22),rgba(5,22,46,.2) 70%)}
.disc i.o{left:-9%;right:-9%;height:64%;bottom:-4%;border-width:1px;opacity:.5}
.screen{position:absolute;left:14%;right:14%;top:0;height:74%;transform:perspective(520px) rotateX(16deg);border:2px solid rgba(110,230,255,.85);border-radius:10px;

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(43,134,255,.14);font-size:.78rem;font-weight:700;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:#7a8fb0}
.c-working i,.c-meeting i{background:var(--ok);box-shadow:0 0 6px var(--ok)}.c-done i,.c-published i,.c-dry-run i,.c-pass i{background:var(--ok)}

.big{font-size:1.15rem;font-weight:700;margin:8px 0 2px}.muted{color:var(--mute);font-size:.86rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(43,134,255,.2);vertical-align:top}

a{color:#8fd0ff}footer{color:var(--mute);font-size:.8rem;margin-top:36px;text-align:center}

  .bot .tag{font-size:10px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.bot .cap{font-size:9px;max-width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.lines .doc{display:none}}
</style>

      var p=posFor(r),boss=r==="boss",eye=boss?"#ffd166":(DEPT_EYE[(meta[r]||{}).dept]||"#6ea8ff"),rb=robot(r,boss,eye);
      var tag=el("div",{class:"tag"},[label(r).replace(/\s*\(.*\)/,"")]),cap=el("div",{class:"cap"});
      var b=el("div",{class:"bot idle"+(boss?" boss":""),role:"listitem",style:"left:"+p.x.toFixed(2)+"%;top:"+p.y.toFixed(2)+"%;--eye:"+eye},[rb.svg,tag,cap]);
      st.appendChild(b);refs[r].b=b;refs[r].cap=cap;refs[r].badge=rb.badge;
    });
  }

  function mode(r){
    if(r.status==="working")return r.room==="conference"?"meeting":"working";
    if(r.room==="breakroom"||(r.on_break_until&&new Date(r.on_break_until)>now))return "break";
    return r.status||"idle";
  }
  function fromState(){
    var last=state&&state.runs&&state.runs[state.runs.length-1],by={};((last&&last.stages)||[]).forEach(function(s){by[s.role]=s;});
    return roles.map(function(r){var s=by[r.id];var st=s?(s.status==="done"||s.status==="skipped"?"idle":s.status):"idle";
      return {role:r.id,status:st,description:s?s.note:null,room:"home",home_room:"home"};});
  }
  function diff(next){
    if(prev){next.forEach(function(r){var b=prev[r.role];if(!b)return;var t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      if(r.status==="working"&&b.status!=="working")feed.unshift({t:t,r:label(r.role),x:"started: "+(r.description||"working")});
      else if(b.status==="working"&&r.status==="idle")feed.unshift({t:t,r:label(r.role),x:r.room==="breakroom"?"finished, coffee break":"finished"});
      else if(r.status==="blocked"&&b.status!=="blocked")feed.unshift({t:t,r:label(r.role),x:"blocked: "+(r.description||"")});
      else if(r.status==="failed"&&b.status!=="failed")feed.unshift({t:t,r:label(r.role),x:"failed: "+(r.description||"")});
      if(r.room==="conference"&&b.room!=="conference")feed.unshift({t:t,r:label(r.role),x:"joined a meeting"});});
      feed=feed.slice(0,40);}
    prev={};next.forEach(function(r){prev[r.role]={status:r.status,room:r.room};});
  }

  function update(){
    var live=rows&&now-lastOk<12000,list=rows||fromState(),by={};list.forEach(function(r){by[r.role]=r;});
    var conn=document.getElementById("conn");conn.className="conn "+(live?"live":"off");conn.lastChild.textContent=live?"LIVE · updates every 4s":"offline · showing the last saved run";
    var working=0,meeting=[],furthest=-1,topDesc="";
    RING.concat(["boss"]).forEach(function(rl){
      var r=by[rl]||{role:rl,status:"idle"},m=mode(r),ref=refs[rl];if(!ref)return;
      ref.b.className="bot "+m+(rl==="boss"?" boss":"");
      var on=m==="working"||m==="meeting";
      if(ref.on){ref.on.classList.toggle("show",on);ref.doc.classList.toggle("show",on);}
      var txt=on&&r.started_at?clock(now-new Date(r.started_at))+" · "+(r.description||"working"):(r.description||"");
      ref.cap.textContent=m==="break"?"coffee break":cut(txt,44);
      ref.b.title=label(rl)+" · "+m+(r.description?": "+r.description:"");
      ref.b.setAttribute("aria-label",label(rl)+", "+m+(r.description?", "+r.description:""));
      ref.badge.textContent=m==="break"?"☕":m==="meeting"?"🤝":m==="blocked"?"⛔":m==="failed"?"❌":"";
      if(r.status==="working"){working++;var ix=ORDER.indexOf(rl);if(ix>furthest){furthest=ix;topDesc=label(rl)+": "+(r.description||"working");}}
      if(m==="meeting")meeting.push(rl);
    });
    // meeting links
    var mg=document.getElementById("meet");if(mg){mg.textContent="";for(var i=0;i<meeting.length-1;i++){var a=posFor(meeting[i]),b=posFor(meeting[i+1]);
      mg.appendChild(sv("path",{class:"meet",d:"M"+(a.x*10)+" "+(a.y*VH/100)+" L"+(b.x*10)+" "+(b.y*VH/100)}));}}
    var last=state&&state.runs&&state.runs[state.runs.length-1];
    refs.hub.dot.className=live?"":"off";
    refs.hub.fill.style.width=(working?Math.max(6,Math.round((furthest+1)/ORDER.length*100)):0)+"%";
    refs.plat.pb.style.width=refs.hub.fill.style.width;
    refs.hub.stat.textContent="";refs.hub.stat.appendChild(el("span",{},[el("b",{},[working+"/"+list.length])," roles working  ·  ",el("b",{},[String(meeting.length)])," in a meeting  ·  "+(live?"live updates":"offline")]));
    var lines=feed.slice(0,2);refs.hub.l1.textContent="";refs.hub.l2.textContent="";
    [refs.hub.l1,refs.hub.l2].forEach(function(n,i){var e=lines[i];if(e){n.appendChild(el("em",{},[e.r.toLowerCase()+": "]));n.appendChild(document.createTextNode(e.x));}});
    if(!lines.length){refs.hub.l1.textContent=last?"last run: "+last.status+(last.title?" · "+cut(last.title,46):""):"waiting for the first run…";}
    refs.plat.cap.textContent=working?"now producing":(last&&last.status==="published"?"last video published":"live stream");
    refs.plat.cap2.textContent=working?cut(topDesc,60):(last?(last.title||last.topic||last.note||""):"The next video starts here");
    below(list,last,live);
  }

  function below(list,last,live){
    var s=JSON.stringify([list.map(function(r){return [r.role,r.status,r.description];}),feed.length&&feed[0].t+feed[0].x,last&&last.id+last.status,live]);
    if(s===sig)return;sig=s;
    var b=document.getElementById("below");b.textContent="";
    var by={};list.forEach(function(r){by[r.role]=r;});
    b.appendChild(el("h2",{},["Live feed",el("small",{},["what just happened"])]));
    var f=el("div",{class:"card feed"});if(!feed.length)f.appendChild(el("div",{class:"muted"},[live?"Watching… events appear here the moment a role starts or finishes.":"Not connected to the live board."]));
    feed.forEach(function(e){f.appendChild(el("div",{},[el("time",{},[e.t]),el("span",{},[el("b",{},[e.r+" "]),e.x])]));});
    var flow=el("div",{class:"flow"});
    ORDER.forEach(function(id,i){var r=by[id],m=r?mode(r):"idle";flow.appendChild(chip(m,nice(id)));if(i<ORDER.length-1)flow.appendChild(document.createTextNode("→"));});
    b.appendChild(el("div",{class:"cols"},[f,el("div",{},[el("div",{class:"card"},[el("div",{class:"muted"},["How a video moves through the studio"]),el("div",{style:"height:8px"}),flow])])]));
    if(last){
      b.appendChild(el("h2",{},["Latest run",el("small",{},[last.mode+" · "+when(last.started)])]));
      b.appendChild(el("div",{class:"card"},[chip(last.status,last.status),el("div",{class:"big"},[last.title||last.topic||"(stopped before a title existed)"]),last.note?el("div",{class:"muted"},[last.note]):"",
        last.video_id?el("a",{href:"https://youtu.be/"+encodeURIComponent(last.video_id),target:"_blank",rel:"noopener"},["Watch on YouTube"]):""]));
      b.appendChild(el("h2",{},["Quality gates",el("small",{},["every one must pass or nothing ships"])]));
      var g=el("div",{class:"gates"});(last.gates||[]).forEach(function(x){g.appendChild(el("div",{class:"gate"+(x.passed?"":" fail")},[el("i"),el("div",{},[el("b",{},[nice(x.name)]),el("span",{},[x.detail||""])])]));});
      if(!(last.gates||[]).length)g.appendChild(el("div",{class:"muted"},["No gate was reached in this run."]));b.appendChild(g);
      var tb=el("tbody");state.runs.slice().reverse().slice(0,12).forEach(function(r){var fails=(r.gates||[]).filter(function(x){return !x.passed;}).length;
        var v=r.video_id?el("a",{href:"https://youtu.be/"+encodeURIComponent(r.video_id),target:"_blank",rel:"noopener"},[r.title||r.video_id]):(r.title||r.topic||"-");
        tb.appendChild(el("tr",{},[el("td",{},[when(r.started)]),el("td",{},[r.mode]),el("td",{},[chip(r.status,r.status)]),el("td",{},[v]),el("td",{},[(r.gates||[]).length?(r.gates.length-fails)+"/"+r.gates.length+" passed":"-"])]));});
      b.appendChild(el("h2",{},["Run history"]));
      b.appendChild(el("div",{class:"card scroll"},[el("table",{},[el("thead",{},[el("tr",{},["When","Mode","Result","Video","Gates"].map(function(h){return el("th",{},[h]);}))]),tb])]));
    }
  }

  function poll(){
    getJSON(SB_URL+"?select="+COLS+"&order=role.asc",{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}).then(function(d){
      now=Date.now();rows=d;lastOk=now;diff(rows);update();
    }).catch(function(){now=Date.now();update();});
  }
  Promise.all([getJSON("roles.json"),getJSON("state.json?t="+Date.now()).catch(function(){return null;})]).then(function(r){
    roles=r[0];state=r[1];roles.forEach(function(x){meta[x.id]=x;});build();update();poll();
    setInterval(poll,4000);
    setInterval(function(){now=Date.now();if(rows&&rows.some(function(x){return x.status==="working";}))update();},1000);
    setInterval(function(){getJSON("state.json?t="+Date.now()).then(function(s){state=s;sig="";}).catch(function(){});},30000);
  }).catch(function(e){document.getElementById("stage").textContent="Couldn't load the studio board ("+e.message+").";});
})();
</script>
