<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Money Blueprint Studio</title>
<meta name="description" content="Live office of the automated studio behind The Money Blueprint: who is working on what right now, and whether the last video passed every gate.">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0b1f3a;--mute:#5a6b86;--line:#d5deec;--gold:#b97f00;--chip:#eaf0f9;--floor:#f6f8fc;
--ok:#12805c;--warn:#a65f00;--bad:#b3261e;--idle:#8b98ad;--hero:#0b1f3a;--hero-ink:#fff;--accent:#f5b82e;--live:#12a36b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07142a;--card:#0e2442;--ink:#e8eef8;--mute:#9fb3cf;--line:#1c4676;--gold:#f5b82e;--chip:#14325a;--floor:#0b1d38;
--ok:#4cd6a0;--warn:#ffb74d;--bad:#ff8a80;--idle:#6f84a6;--hero:#0e2442;--live:#4cd6a0}}
:root[data-theme=dark]{--bg:#07142a;--card:#0e2442;--ink:#e8eef8;--mute:#9fb3cf;--line:#1c4676;--gold:#f5b82e;--chip:#14325a;--floor:#0b1d38;--ok:#4cd6a0;--warn:#ffb74d;--bad:#ff8a80;--idle:#6f84a6;--hero:#0e2442;--live:#4cd6a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}
header{background:var(--hero);color:var(--hero-ink);padding:26px 0 22px}
header .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:0}
h1{margin:0;font-size:1.55rem}h1 span{color:var(--accent)}
.sub{margin:4px 0 0;color:#b9c8df;font-size:.93rem}
h2{font-size:1.05rem;margin:30px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
h2 small{font-weight:400;color:var(--mute);font-size:.84rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:.8rem;font-weight:700;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.s-done .dot,.s-published .dot,.s-pass .dot,.s-dry-run .dot,.s-idle-ok .dot{background:var(--ok)}
.s-working .dot,.s-meeting .dot,.s-running .dot{background:var(--accent);animation:pulse 1.2s infinite}
.s-blocked .dot,.s-skipped .dot,.s-break .dot{background:var(--warn)}
.s-failed .dot,.s-fail .dot{background:var(--bad)}
.live{background:rgba(18,163,107,.18);color:var(--live)}
.live .dot{background:var(--live);animation:pulse 1.4s infinite}
.offline{background:rgba(255,183,77,.18);color:var(--warn)}
.offline .dot{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,184,46,.55)}70%{box-shadow:0 0 0 7px rgba(245,184,46,0)}100%{box-shadow:0 0 0 0 rgba(245,184,46,0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--mute);font-size:.82rem}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.room{background:var(--floor);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.room h3{margin:0;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.room .blurb{color:var(--mute);font-size:.78rem;margin-top:-4px}
.room.lit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.desk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:flex-start;min-height:64px}
.desk.away{opacity:.55;border-style:dashed}
.desk.working,.desk.meeting{border-color:var(--accent)}
.desk.failed{border-color:var(--bad)}.desk.blocked{border-color:var(--warn)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.78rem;color:#fff;position:relative}
.av.working,.av.meeting{box-shadow:0 0 0 3px var(--accent);animation:pulse 1.2s infinite}
.av.failed{box-shadow:0 0 0 3px var(--bad)}.av.blocked{box-shadow:0 0 0 3px var(--warn)}
.av .cup{position:absolute;right:-6px;bottom:-6px;font-size:.9rem}
.who{min-width:0;flex:1}.who b{display:block;font-size:.84rem;line-height:1.2}
.who i{display:block;font-style:normal;color:var(--mute);font-size:.74rem;line-height:1.25;overflow-wrap:anywhere}
.who .t{color:var(--gold);font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.78rem}
.person .av{width:26px;height:26px;font-size:.62rem}
.table{height:34px;border-radius:50%;background:var(--chip);border:2px solid var(--line)}
.empty{color:var(--mute);font-size:.82rem;padding:2px 0}
.feed{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto}
.feed div{font-size:.86rem;display:flex;gap:10px}.feed time{color:var(--mute);font-size:.76rem;flex:none;min-width:58px}
.flow{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;font-size:.8rem;color:var(--mute)}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gate{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.gate b{display:block;font-size:.9rem}.gate span{color:var(--mute);font-size:.82rem;overflow-wrap:anywhere}
.t-big{font-size:1.15rem;font-weight:700;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.scroll{overflow-x:auto}
footer{color:var(--mute);font-size:.82rem;margin-top:34px}a{color:inherit}
@media (max-width:900px){.floor{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.floor{grid-template-columns:1fr}h1{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>The Money <span>Blueprint</span> Studio</h1>
  <p class="sub">The live office behind the channel: every video is researched, checked and gated by named roles before anything is published.</p></div>
  <div id="conn" class="chip offline"><i class="dot"></i><span>connecting…</span></div>
</div></header>
<main class="wrap" id="app" aria-live="polite"><p class="empty">Loading the office…</p></main>
<script>
(function(){
  var SB_URL="https://qxyvmvtecnnwqeqaouzh.supabase.co/rest/v1/studio_board";
  var SB_KEY="sb_publishable_Ki9OarmjSVz_KdSuenGZMQ_jB4eIvGO"; // public publishable key; read-only here
  var COLS="role,status,description,model,pipeline_name,pipeline_stage,pipeline_total,started_at,updated_at,home_room,room,on_break_until";
  var ROOMS=[
   {id:"newsroom",name:"Newsroom",icon:"📰",blurb:"topic, research, data, script"},
   {id:"standards_desk",name:"Standards Desk",icon:"🛡️",blurb:"fact-check, policy, originality"},
   {id:"production_floor",name:"Production Floor",icon:"🎬",blurb:"charts, voice, edit, thumbnail"},
   {id:"publishing_suite",name:"Publishing Suite",icon:"📤",blurb:"publish, go / no-go, analytics"},
   {id:"control_room",name:"Control Room",icon:"🖥️",blurb:"watches every run"},
   {id:"exec_suite",name:"Exec Suite",icon:"👔",blurb:"you + Claude Code"},
   {id:"conference",name:"Conference Room",icon:"🤝",blurb:"roles working the same video together"},
   {id:"breakroom",name:"Breakroom",icon:"☕",blurb:"a short break after each task"}];
  var HOME={head_of_content:"newsroom",researcher:"newsroom",data_analyst:"newsroom",scriptwriter:"newsroom",fact_checker:"standards_desk",policy_editor:"standards_desk",originality_editor:"standards_desk",director:"production_floor",chart_designer:"production_floor",voice_actor:"production_floor",video_editor:"production_floor",thumbnail_designer:"production_floor",publisher:"publishing_suite",producer:"publishing_suite",analyst:"publishing_suite",ops:"control_room",boss:"exec_suite"};
  var DEPT_COLOR={"Editorial":"#2a7de1","Standards":"#8e44ad","Production":"#d9822b","Publishing & Growth":"#17916b","Operations":"#5d6d86"};
  var ORDER=["head_of_content","researcher","data_analyst","scriptwriter","fact_checker","policy_editor","originality_editor","director","chart_designer","voice_actor","video_editor","thumbnail_designer","publisher","producer"];
  var roles=[],meta={},state=null,rows=null,prev=null,feed=[],lastOk=0,now=Date.now();

  function el(tag,attrs,kids){var n=document.createElement(tag);Object.keys(attrs||{}).forEach(function(k){if(k==="class")n.className=attrs[k];else n.setAttribute(k,attrs[k]);});
    [].concat(kids==null?[]:kids).forEach(function(c){if(c==null||c==="")return;n.appendChild(typeof c==="string"?document.createTextNode(c):c);});return n;}
  function chip(cls,text){return el("span",{class:"chip s-"+cls},[el("i",{class:"dot"}),text]);}
  function nice(s){return String(s).replace(/_/g," ");}
  function when(iso){try{return new Date(iso).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});}catch(e){return iso||"";}}
  function clock(ms){var s=Math.max(0,Math.floor(ms/1000));return s<60?s+"s":Math.floor(s/60)+"m "+(s%60)+"s";}
  function initials(t){return t.replace(/\(.*\)/,"").split(/[\s-]+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join("");}
  function getJSON(u,h){return fetch(u,{headers:h||{},cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}

  function mode(r){
    if(r.status==="working")return r.room==="conference"?"meeting":"working";
    if(r.room==="breakroom"||(r.on_break_until&&new Date(r.on_break_until)>now))return "break";
    return r.status||"idle";
  }
  function label(role){return (meta[role]&&meta[role].title)||nice(role);}
  function person(r,mini){
    var m=mode(r),color=DEPT_COLOR[(meta[r.role]||{}).dept]||"#5d6d86";
    return el("div",{class:mini?"person":"desk "+m},[
      el("div",{class:"av "+m,style:"background:"+color},[initials(label(r.role)),m==="break"?el("span",{class:"cup"},["☕"]):""]),
      mini?el("span",{},[label(r.role)]):el("div",{class:"who"},[el("b",{},[label(r.role)]),
        el("i",{class:m==="working"||m==="meeting"?"t":""},[ (r.status==="working"&&r.started_at?clock(now-new Date(r.started_at))+" · ":"")+(r.description||(m==="break"?"on a coffee break":m))])])]);
  }
  function awayDesk(r){var where=r.room==="conference"?"in the conference room":r.room==="breakroom"?"on a coffee break":"away";
    return el("div",{class:"desk away"},[el("div",{class:"av",style:"background:var(--idle)"},[initials(label(r.role))]),el("div",{class:"who"},[el("b",{},[label(r.role)]),el("i",{},[where])])]);}

  function diff(next){
    if(prev){next.forEach(function(r){var b=prev[r.role];if(!b)return;var t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      if(r.status==="working"&&b.status!=="working")feed.unshift({t:t,x:"🟢 "+label(r.role)+" started: "+(r.description||"working")});
      else if(b.status==="working"&&r.status==="idle")feed.unshift({t:t,x:(r.room==="breakroom"?"☕ ":"✅ ")+label(r.role)+" finished"+(r.room==="breakroom"?", coffee break":"")});
      else if(r.status==="blocked"&&b.status!=="blocked")feed.unshift({t:t,x:"⛔ "+label(r.role)+" blocked: "+(r.description||"")});
      else if(r.status==="failed"&&b.status!=="failed")feed.unshift({t:t,x:"❌ "+label(r.role)+" failed: "+(r.description||"")});
      if(r.room==="conference"&&b.room!=="conference")feed.unshift({t:t,x:"🤝 "+label(r.role)+" joined a meeting"});});
      feed=feed.slice(0,40);}
    prev={};next.forEach(function(r){prev[r.role]={status:r.status,room:r.room};});
  }

  function fromState(){ // fallback when the live table can't be reached: show the last saved run
    var last=state&&state.runs&&state.runs[state.runs.length-1],by={};((last&&last.stages)||[]).forEach(function(s){by[s.role]=s;});
    return roles.map(function(r){var s=by[r.id];var st=s?(s.status==="done"?"idle":s.status):"idle";
      return {role:r.id,status:st==="skipped"?"idle":st,description:s?s.note:null,home_room:HOME[r.id]||"lobby",room:HOME[r.id]||"lobby"};});
  }

  function render(){
    var app=document.getElementById("app");app.textContent="";
    var live=rows&&now-lastOk<12000,list=rows||fromState(),by={};list.forEach(function(r){by[r.role]=r;});
    var conn=document.getElementById("conn");conn.className="chip "+(live?"live":"offline");conn.lastChild.textContent=live?"LIVE · updates every 4s":"offline · showing the last saved run";
    var working=list.filter(function(r){return r.status==="working";}).length,bad=list.filter(function(r){return r.status==="blocked"||r.status==="failed";}).length;
    var last=state&&state.runs&&state.runs[state.runs.length-1];
    app.appendChild(el("div",{class:"stats"},[
      el("div",{class:"card stat"},[el("b",{},[String(working)]),el("span",{},["working right now, of "+list.length+" roles"])]),
      el("div",{class:"card stat"},[el("b",{},[String(list.filter(function(r){return mode(r)==="meeting";}).length)]),el("span",{},["in the conference room"])]),
      el("div",{class:"card stat"},[el("b",{},[String(bad)]),el("span",{},["blocked or failed"])]),
      el("div",{class:"card stat"},[el("b",{style:"font-size:1.15rem"},[last?last.status:"no runs yet"]),el("span",{},[last?"last run · "+last.mode:"waiting for the first run"])])]));

    app.appendChild(el("h2",{},["The office",el("small",{},["roles sit at their desks, meet in the conference room when they work the same video, and take a coffee break after each task"])]));
    var floor=el("div",{class:"floor"});
    ROOMS.forEach(function(rm){
      var here=list.filter(function(r){return r.room===rm.id;}),homeRoles=list.filter(function(r){return (r.home_room||HOME[r.role])===rm.id;});
      var box=el("div",{class:"room"+(here.some(function(r){return r.status==="working";})?" lit":"")},[
        el("h3",{},[el("span",{},[rm.icon+" "+rm.name]),el("span",{class:"chip",style:"font-size:.72rem"},[String(here.length)])]),el("div",{class:"blurb"},[rm.blurb])]);
      if(rm.id==="conference"||rm.id==="breakroom"){
        box.appendChild(el("div",{class:"table"}));
        box.appendChild(here.length?el("div",{class:"people"},here.map(function(r){return person(r,true);})):el("div",{class:"empty"},[rm.id==="conference"?"Empty. Roles meet here when two or more work on the same video at once.":"Empty."]));
      }else{
        var d=el("div",{class:"desks"});homeRoles.forEach(function(r){d.appendChild(r.room===rm.id?person(r,false):awayDesk(r));});box.appendChild(d);
      }
      floor.appendChild(box);
    });
    app.appendChild(floor);

    app.appendChild(el("h2",{},["Live feed",el("small",{},["what just happened"])]));
    var f=el("div",{class:"card feed"});
    if(!feed.length)f.appendChild(el("div",{class:"empty"},[live?"Watching… events appear here the moment a role starts or finishes.":"Not connected to the live board."]));
    feed.forEach(function(e){f.appendChild(el("div",{},[el("time",{},[e.t]),el("span",{},[e.x])]));});
    app.appendChild(f);

    app.appendChild(el("h2",{},["How a video moves through the studio",el("small",{},["each role reads the previous role's work"])]));
    var flow=el("div",{class:"flow"});
    ORDER.forEach(function(id,i){var r=by[id];var m=r?mode(r):"idle";flow.appendChild(chip(m,nice(id)));if(i<ORDER.length-1)flow.appendChild(document.createTextNode("→"));});
    app.appendChild(el("div",{class:"card"},[flow]));

    if(last){
      app.appendChild(el("h2",{},["Latest run",el("small",{},[last.mode+" · "+when(last.started)])]));
      app.appendChild(el("div",{class:"card"},[chip(last.status,last.status),el("div",{class:"t-big"},[last.title||last.topic||"(stopped before a title existed)"]),
        last.note?el("div",{class:"empty"},[last.note]):"",last.video_id?el("a",{href:"https://youtu.be/"+encodeURIComponent(last.video_id),target:"_blank",rel:"noopener"},["Watch on YouTube"]):""]));
      app.appendChild(el("h2",{},["Quality gates",el("small",{},["every one must pass or nothing ships"])]));
      var g=el("div",{class:"gates"});
      (last.gates||[]).forEach(function(x){g.appendChild(el("div",{class:"gate s-"+(x.passed?"pass":"fail")},[el("i",{class:"dot"}),el("div",{},[el("b",{},[nice(x.name)]),el("span",{},[x.detail||""])])]));});
      if(!(last.gates||[]).length)g.appendChild(el("p",{class:"empty"},["No gate was reached in this run."]));
      app.appendChild(g);
      var runs=state.runs.slice().reverse().slice(0,12),tb=el("tbody");
      runs.forEach(function(r){var fails=(r.gates||[]).filter(function(x){return !x.passed;}).length;
        var v=r.video_id?el("a",{href:"https://youtu.be/"+encodeURIComponent(r.video_id),target:"_blank",rel:"noopener"},[r.title||r.video_id]):(r.title||r.topic||"-");
        tb.appendChild(el("tr",{},[el("td",{},[when(r.started)]),el("td",{},[r.mode]),el("td",{},[chip(r.status,r.status)]),el("td",{},[v]),el("td",{},[(r.gates||[]).length?(r.gates.length-fails)+"/"+r.gates.length+" passed":"-"])]));});
      app.appendChild(el("h2",{},["Run history"]));
      app.appendChild(el("div",{class:"card scroll"},[el("table",{},[el("thead",{},[el("tr",{},["When","Mode","Result","Video","Gates"].map(function(h){return el("th",{},[h]);}))]),tb])]));
    }
    app.appendChild(el("footer",{},["Educational explainers built from public data (FRED, World Bank). Narration is AI-generated. Not financial advice."]));
  }

  function poll(){
    getJSON(SB_URL+"?select="+COLS+"&order=role.asc",{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}).then(function(d){
      now=Date.now();rows=d.map(function(r){r.home_room=r.home_room||HOME[r.role]||"lobby";r.room=r.room||r.home_room;return r;});lastOk=now;diff(rows);render();
    }).catch(function(){now=Date.now();render();});
  }
  Promise.all([getJSON("roles.json"),getJSON("state.json?t="+Date.now()).catch(function(){return null;})]).then(function(r){
    roles=r[0];state=r[1];roles.forEach(function(x){meta[x.id]=x;});render();poll();
    setInterval(poll,4000);
    setInterval(function(){now=Date.now();if(rows&&rows.some(function(r){return r.status==="working";}))render();},1000); // elapsed timers tick only while someone is working
    setInterval(function(){getJSON("state.json?t="+Date.now()).then(function(s){state=s;}).catch(function(){});},30000);
  }).catch(function(e){var a=document.getElementById("app");a.textContent="";a.appendChild(el("p",{class:"empty"},["Couldn't load the studio board ("+e.message+")."]));});
})();
</script>
</body>
</html>
