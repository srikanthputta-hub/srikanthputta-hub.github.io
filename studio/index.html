<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Console</title>
<meta name="description" content="Live production console for The Money Blueprint studio: pipeline, quality gates and run history.">
<style>
:root{
  --bg:#0b0f17;--bg2:#0f1521;--panel:#121a28;--panel2:#162033;--line:#1f2b40;--line2:#2a3a55;
  --text:#e8eef8;--mute:#8d9bb3;--faint:#5f6e88;
  --accent:#4c8dff;--accent-s:rgba(76,141,255,.14);
  --ok:#2fd394;--ok-s:rgba(47,211,148,.14);--warn:#f5b544;--warn-s:rgba(245,181,68,.14);--bad:#ff6b6b;--bad-s:rgba(255,107,107,.14);--meet:#b48cff;--meet-s:rgba(180,140,255,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 28px rgba(0,0,0,.35);
  --r:14px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f9;--bg2:#eaeef5;--panel:#ffffff;--panel2:#f6f8fc;--line:#e1e6ef;--line2:#cfd7e6;
  --text:#101828;--mute:#566379;--faint:#8794ab;
  --accent:#2563eb;--accent-s:rgba(37,99,235,.10);--ok:#0f9d6b;--ok-s:rgba(15,157,107,.10);--warn:#b7791f;--warn-s:rgba(183,121,31,.12);--bad:#d92d3f;--bad-s:rgba(217,45,63,.10);--meet:#7c4dff;--meet-s:rgba(124,77,255,.10);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);}}
:root[data-theme="light"]{
  --bg:#f3f5f9;--bg2:#eaeef5;--panel:#ffffff;--panel2:#f6f8fc;--line:#e1e6ef;--line2:#cfd7e6;
  --text:#101828;--mute:#566379;--faint:#8794ab;
  --accent:#2563eb;--accent-s:rgba(37,99,235,.10);--ok:#0f9d6b;--ok-s:rgba(15,157,107,.10);--warn:#b7791f;--warn-s:rgba(183,121,31,.12);--bad:#d92d3f;--bad-s:rgba(217,45,63,.10);--meet:#7c4dff;--meet-s:rgba(124,77,255,.10);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.01em}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--panel);color:var(--mute)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.pill.live i{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.pill.stale{color:var(--warn)}.pill.stale i{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,148,.55)}70%{box-shadow:0 0 0 8px rgba(47,211,148,0)}100%{box-shadow:0 0 0 0 rgba(47,211,148,0)}}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:24px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:6px}
.rail h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:650;margin:2px 10px 8px}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;font:inherit}
.ch:hover{background:var(--panel)}
.ch[aria-selected="true"]{background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow)}
.ch:focus-visible,.tab:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-weight:700;font-size:12px;color:#fff}
.ch b{display:block;font-size:13.5px;font-weight:620;line-height:1.2}.ch span.sub{display:block;font-size:11.5px;color:var(--mute)}
.ch .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.ch .dot.ok{background:var(--ok)}.ch .dot.warn{background:var(--warn)}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--mute);margin-top:2px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:650}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2{font-size:14.5px;font-weight:650}.ph .hint{color:var(--mute);font-size:12.5px;margin-left:auto}
.pb{padding:18px}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;position:relative}
.step{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;min-height:132px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s}
.step .n{font-size:11px;color:var(--faint);font-weight:650;letter-spacing:.08em}
.step h3{font-size:13.5px;font-weight:650}
.step .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--mute)}
.step .st i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.step .what{font-size:12px;color:var(--mute);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.step .t{margin-top:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.step.working{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-s),var(--panel2))}.step.working .st{color:var(--accent)}.step.working .st i{background:var(--accent);animation:pulse2 1.4s infinite}
.step.meeting{border-color:var(--meet);background:linear-gradient(180deg,var(--meet-s),var(--panel2))}.step.meeting .st{color:var(--meet)}.step.meeting .st i{background:var(--meet);animation:pulse2 1.4s infinite}
.step.done .st{color:var(--ok)}.step.done .st i{background:var(--ok)}
.step.blocked{border-color:var(--warn)}.step.blocked .st{color:var(--warn)}.step.blocked .st i{background:var(--warn)}
.step.failed{border-color:var(--bad)}.step.failed .st{color:var(--bad)}.step.failed .st i{background:var(--bad)}
.step.break .st i{background:var(--warn)}
@keyframes pulse2{50%{opacity:.35}}
.meet{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 12px;border-radius:10px;background:var(--meet-s);color:var(--meet);font-weight:600;font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.gate{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}.gate:last-child{border-bottom:0}
.gi{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.gi.ok{background:var(--ok-s);color:var(--ok)}.gi.bad{background:var(--bad-s);color:var(--bad)}
.gate b{font-size:13px}.gate div div{color:var(--mute);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.feed{max-height:340px;overflow:auto}
.ev{display:flex;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:flex-start}.ev:last-child{border-bottom:0}
.ev time{flex:none;width:86px;white-space:nowrap;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.ev b{font-weight:620}.ev span{color:var(--mute)}
.empty{padding:26px 18px;color:var(--mute);text-align:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
td.t{max-width:380px}td.n{white-space:nowrap;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.warn{background:var(--warn-s);color:var(--warn)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.info{background:var(--accent-s);color:var(--accent)}.chip.mute{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.setup li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);list-style:none}.setup li:last-child{border:0}
.setup ul{margin:0;padding:0}
.setup .gi{margin-top:1px}.gi.todo{background:var(--panel2);color:var(--faint);border:1px solid var(--line2)}
.note{color:var(--mute);font-size:12.5px;margin-top:10px}
footer{max-width:1280px;margin:0 auto;padding:6px 24px 36px;color:var(--faint);font-size:12px}
.hidden{display:none!important}
@media (max-width:1100px){.flow{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px;gap:16px}
  .shell>*{min-width:0;max-width:100%}html,body{overflow-x:hidden}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.rail h2{display:none}.ch{width:auto;flex:none;min-width:190px;border-color:var(--line);background:var(--panel)}
  .top{padding:10px 16px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:20px}
}
@media (max-width:640px){
  table,tbody,tr,td{display:block}thead{display:none}
  tr{padding:12px 18px;border-bottom:1px solid var(--line)}tr:last-child{border-bottom:0}
  td{padding:2px 0;border:0}td.t{max-width:none}
  .brand small{display:none}.pill{font-size:11px;padding:4px 10px}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.flow{grid-template-columns:1fr}.step{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var CHANNELS=[

  var meta={},roles=[],state=null,rows=null,lastOk=0,now=Date.now(),sel="finance",events=[],prev={};
  function el(t,a,k){var n=document.createElement(t);for(var x in (a||{})){if(x==="class")n.className=a[x];else n.setAttribute(x,a[x]);}
    [].concat(k==null?[]:k).forEach(function(c){if(c==null||c===false)return;n.appendChild(typeof c==="string"?document.createTextNode(c):c);});return n;}
  function nice(s){return String(s).replace(/_/g," ");}

  function latest(){return state&&state.runs&&state.runs.length?state.runs[state.runs.length-1]:null;}
  function cur(){return CHANNELS.filter(function(c){return c.id===sel;})[0];}

  /* ---------- channel rail ---------- */

  /* ---------- derived state ---------- */

  function pipeline(c){
    var inMeet=c.live?meetingNames():[];
    var body=el("div",{class:"pb"});
    if(inMeet.length>1)body.appendChild(el("div",{class:"meet"},["In a meeting: "+inMeet.map(title).join(", ")+" are reviewing the same plan together"]));

    FLOW.forEach(function(r,i){
      var row=c.live?rowFor(r):null,ls=c.live?lastStage(r):null,cls="",label="Idle",txt="",tm="";
      if(!c.live){label="Not started";txt=(meta[r]||{}).summary||"";}
      else if(row&&row.status==="working"){cls=inMeet.indexOf(r)>-1?"meeting":"working";label=cls==="meeting"?"In a meeting":"Working";txt=row.description||"";tm=row.started_at?clock(now-new Date(row.started_at).getTime()):"";}
      else if(row&&(row.status==="blocked"||row.status==="failed")){cls=row.status;label=row.status==="blocked"?"Blocked":"Failed";txt=row.description||"";}

    return el("section",{class:"panel"},[el("div",{class:"ph"},[el("h2",{},["Production pipeline"]),el("span",{class:"hint"},[c.live?"Live from the studio board":"Idle until this channel's source adapter is built"])]),body]);}
  function gates(c){
    var l=c.live?latest():null,box=el("div",{});
    if(l&&l.gates&&l.gates.length)l.gates.forEach(function(g){box.appendChild(el("div",{class:"gate"},[
      el("span",{class:"gi "+(g.passed?"ok":"bad")},[g.passed?"✓":"✕"]),el("div",{},[el("b",{},[sent(g.name)]),el("div",{},[g.detail||""])])]));});
    else box.appendChild(el("div",{class:"empty"},[c.live?"Gates appear after a run.":"Each channel will have its own gates (sources, facts, policy, originality, length)."]));
    return el("section",{class:"panel"},[el("div",{class:"ph"},[el("h2",{},["Quality gates"]),el("span",{class:"hint"},[l?cut(l.topic||l.title||"",44):"Every gate must pass or nothing ships"])]),box]);}
  function activity(c){
    var box=el("div",{class:"feed"}),list=[];
    if(c.live){list=events.slice();var l=latest();if(l&&l.stages)l.stages.slice().reverse().slice(0,10).forEach(function(s){list.push({at:s.at,role:s.role,text:s.note||s.status,hist:true});});}
    list.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
    if(!list.length)box.appendChild(el("div",{class:"empty"},[c.live?"Events appear here the moment a role starts or finishes.":"No activity yet."]));
    list.slice(0,30).forEach(function(e){box.appendChild(el("div",{class:"ev"},[el("time",{},[hm(e.at)]),el("div",{},[el("b",{},[title(e.role)])," ",el("span",{},[cut(e.text,120)])])]));});
    return el("section",{class:"panel"},[el("div",{class:"ph"},[el("h2",{},["Activity"]),el("span",{class:"hint"},["Latest first"])]),box]);}
  function history(c){
    var runs=c.live&&state&&state.runs?state.runs.slice().reverse():[],wrap=el("div",{class:"tablewrap"});
    if(!runs.length){wrap.appendChild(el("div",{class:"empty"},[c.live?"No runs recorded yet.":"This channel has not run yet."]));}
    else{var tb=el("tbody");runs.forEach(function(r){var gp=(r.gates||[]).filter(function(g){return g.passed;}).length,gn=(r.gates||[]).length;
      tb.appendChild(el("tr",{},[el("td",{class:"n"},[when(r.started)]),el("td",{class:"n"},[r.mode]),el("td",{},[runChip(r.status)]),
        el("td",{class:"t"},[r.video_id?el("a",{href:"https://www.youtube.com/watch?v="+r.video_id,target:"_blank",rel:"noopener"},[r.title||r.topic||r.video_id]):(r.title||r.topic||"–"),
          r.note?el("div",{class:"note"},[r.note]):null]),el("td",{class:"n"},[gn?gp+"/"+gn+" passed":"–"])]));});
      wrap.appendChild(el("table",{},[el("thead",{},[el("tr",{},["When","Mode","Result","Video","Gates"].map(function(h){return el("th",{},[h]);}))]),tb]));}
    return el("section",{class:"panel"},[el("div",{class:"ph"},[el("h2",{},["Run history"]),el("span",{class:"hint"},[runs.length?"Last "+runs.length+" runs":""])]),wrap]);}
  function setup(c){
    var ul=el("ul");(c.setup||[]).forEach(function(s){ul.appendChild(el("li",{},[el("span",{class:"gi "+(s[1]?"ok":"todo")},[s[1]?"✓":""]),el("div",{},[el("b",{},[s[0]]),el("div",{class:"note",style:"margin:0"},[s[1]?"Done":"To do"])])]));});
    return el("section",{class:"panel setup"},[el("div",{class:"ph"},[el("h2",{},["Launch checklist"]),el("span",{class:"hint"},["Updated by hand"])]),el("div",{class:"pb"},[ul,
      el("p",{class:"note"},["No schedule is on for this channel. It goes live only after a clean dry run and your approval."])])]);}

  var sig="";
  function render(){
    var c=cur(),m=document.getElementById("main"),s=JSON.stringify([sel,rows&&rows.map(function(r){return [r.role,r.status,r.description,r.on_break_until];}),state&&state.updated,events.length,Math.floor(now/1000)%2&&working().length?1:0]);
    if(s===sig&&!working().length)return;sig=s;
    while(m.firstChild)m.removeChild(m.firstChild);
    m.appendChild(hero(c));m.appendChild(kpis(c));m.appendChild(pipeline(c));
    if(c.live){m.appendChild(el("div",{class:"cols"},[gates(c),activity(c)]));m.appendChild(history(c));}
    else{m.appendChild(setup(c));m.appendChild(history(c));}
  }
  function status(){
    var p=document.getElementById("live"),t=document.getElementById("livetxt"),ok=lastOk&&now-lastOk<15000;
    p.className="pill "+(ok?"live":"stale");t.textContent=ok?"Live · updated "+hm(lastOk):(lastOk?"Reconnecting…":"Showing last saved run");}
  function diff(next){
    next.forEach(function(r){var o=prev[r.role];
      if(o&&o.status!==r.status){var t=r.status==="working"?"started: "+(r.description||"working"):r.status==="idle"?"finished":r.status+(r.description?": "+r.description:"");
        events.unshift({at:new Date().toISOString(),role:r.role,text:t});}
      else if(o&&r.status==="working"&&o.description!==r.description)events.unshift({at:new Date().toISOString(),role:r.role,text:r.description||""});
      prev[r.role]=r;});
    events=events.slice(0,40);
  }
  function poll(){
    getJSON(SB_URL+"?select="+COLS+"&order=role.asc",{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}).then(function(d){
      now=Date.now();rows=d;lastOk=now;diff(rows);status();render();
    }).catch(function(){now=Date.now();status();render();});
  }
  Promise.all([getJSON("roles.json"),getJSON("state.json?t="+Date.now()).catch(function(){return null;})]).then(function(r){
    roles=r[0];state=r[1];roles.forEach(function(x){meta[x.id]=x;});rail();render();status();poll();
    setInterval(poll,4000);
    setInterval(function(){now=Date.now();status();if(working().length)render();},1000);
    setInterval(function(){getJSON("state.json?t="+Date.now()).then(function(s){state=s;sig="";render();}).catch(function(){});},30000);
  }).catch(function(e){document.getElementById("main").textContent="Couldn't load the studio data ("+e.message+").";});
})();
